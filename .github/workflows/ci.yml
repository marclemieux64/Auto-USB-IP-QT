name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "assets/screenshots/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux Test & Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies & Qt6 Libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends             libgl1-mesa-dev             libxkbcommon0             libxkbcommon-x11-0             libxcb-cursor0             libxcb-icccm4             libxcb-image0             libxcb-keysyms1             libxcb-randr0             libxcb-render-util0             libxcb-shape0             libxcb-sync1             libxcb-xfixes0             libxcb-xinerama0             libxcb-xkb1             libegl1             libdbus-1-3             libnss3             libxtst6             libxcomposite1             libxcursor1             libxi6             libxrandr2             desktop-file-utils             appstream             libxml2-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r client/requirements.txt
          pip install pytest pytest-asyncio

      - name: Lint Desktop & AppStream Metadata
        run: |
          desktop-file-validate packaging/org.autousbip.client.desktop
          appstreamcli validate --no-net packaging/org.autousbip.client.metainfo.xml
          xmllint --noout client/security/polkit/org.autousbip.client.policy server/security/polkit/org.autousbip.server.policy

      - name: Syntax Check Python Source Files
        run: |
          python -m py_compile server/autousbip.py client/client.py client/main.py client/app.py client/config.py

      - name: Run Test Suite
        run: |
          pytest tests/ -v

  test-windows:
    name: Windows Test & Validation (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r client/requirements.txt
          pip install pytest pytest-asyncio

      - name: Syntax Check Python Source Files
        run: |
          python -m py_compile server/autousbip.py client/client.py client/main.py client/app.py client/config.py

      - name: Run Test Suite
        run: |
          pytest tests/ -v
