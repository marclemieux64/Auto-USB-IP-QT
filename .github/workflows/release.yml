name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Releases (AppImage, Tarball, Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies & Qt6 Libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libxkbcommon0 \
            libegl1 \
            libdbus-1-3 \
            libnss3 \
            libxtst6 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrandr2 \
            zstd \
            appstream \
            file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Build Linux Client (AppImage & Tarball)
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Build Standalone Linux Server Binary
        run: |
          chmod +x scripts/build-server-binary.sh
          ./scripts/build-server-binary.sh

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoUSBIP-QT-Linux-Artifacts
          path: |
            dist/AutoUSBIP-QT-x86_64.AppImage
            dist/AutoUSBIP-QT-x86_64.tar.gz
            dist/autousbip-qt-server

  build-windows:
    name: Build Windows Releases (Standalone EXE & MSI Installer)
    runs-on: windows-2022
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Build Windows Client EXE
        shell: cmd
        run: |
          call scripts\build-windows-client-exe.bat --no-pause

      - name: Build Windows Server Daemon EXE
        shell: cmd
        run: |
          call scripts\build-windows-server-exe.bat --no-pause

      - name: Build Windows WiX MSI Setup Installer
        shell: cmd
        run: |
          call scripts\build-windows-msi.bat --no-pause

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoUSBIP-QT-Windows-Artifacts
          path: |
            dist\autousbip-qt-client.exe
            dist\AutoUSBIP-QT-Client-Setup.msi
            dist\autousbip-qt-server.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Prepare Release Directory
        run: |
          mkdir -p release_assets
          cp AutoUSBIP-QT-Linux-Artifacts/* release_assets/ 2>/dev/null || true
          cp AutoUSBIP-QT-Windows-Artifacts/* release_assets/ 2>/dev/null || true
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
